<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>音乐</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:#111; color:#fff; font-family:-apple-system,"PingFang SC",sans-serif;
         display:flex; flex-direction:column; align-items:center; justify-content:center;
         min-height:100vh; padding:24px; }
  .cover { width:240px; height:240px; border-radius:16px; object-fit:cover;
           box-shadow:0 8px 32px rgba(0,0,0,.5); position:relative; }
  .play { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
          width:64px; height:64px; border-radius:50%; background:rgba(0,0,0,.55);
          border:2px solid rgba(255,255,255,.85); display:flex; align-items:center;
          justify-content:center; cursor:pointer; }
  .play:active { background:rgba(255,255,255,.25); }
  .play svg { width:28px; height:28px; margin-left:4px; fill:#fff; }
  .coverbox { position:relative; }
  .title { margin-top:28px; font-size:19px; font-weight:600; text-align:center; max-width:90%; }
  .singer { margin-top:10px; font-size:14px; color:#999; text-align:center; }
  .tip { margin-top:32px; font-size:12px; color:#666; text-align:center; }
  .bar { margin-top:24px; width:240px; height:4px; background:#333; border-radius:2px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:#e60026; transition:width .2s; }
</style>
</head>
<body>
  <div class="coverbox">
    <img class="cover" id="cover" src="" alt="">
    <div class="play" id="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
  </div>
  <div class="title" id="title">加载中…</div>
  <div class="singer" id="singer"></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="tip" id="tip">点击封面播放</div>
  <audio id="audio"></audio>
<script>
  // 参数: id(歌曲id) title singer cover audio(mp3直链) plat(平台)
  var q = new URLSearchParams(location.search);
  var title = q.get('title') || '音乐';
  var singer = q.get('singer') || '';
  var cover = q.get('cover') || '';
  var id = q.get('id') || '';
  // 坑133: audio直链带&,塞进jump会被OIAPI解码后当参数分隔符切断。
  // 改传纯id,播放页现场拼meting音频地址,彻底避开编码问题。
  var audio = '';
  if (id) {
    audio = 'https://api.injahow.cn/meting/?type=url&server=netease&id=' + encodeURIComponent(id);
  } else if (q.get('audio')) {
    audio = q.get('audio');
  }
  document.getElementById('title').textContent = title;
  document.getElementById('singer').textContent = singer;
  if (cover) document.getElementById('cover').src = cover;
  var a = document.getElementById('audio');
  var play = document.getElementById('play');
  var tip = document.getElementById('tip');
  var prog = document.getElementById('prog');
  a.src = audio;
  function toggle(){
    if (a.paused) { a.play().then(()=>{tip.textContent='播放中';}).catch(e=>{tip.textContent='点一下播放';a.play();}); }
    else { a.pause(); tip.textContent='已暂停'; }
  }
  play.addEventListener('click', toggle);
  document.getElementById('cover').addEventListener('click', toggle);
  a.addEventListener('timeupdate', function(){ if(a.duration) prog.style.width=(a.currentTime/a.duration*100)+'%'; });
  a.addEventListener('ended', function(){ tip.textContent='播放完成'; prog.style.width='0'; });
  a.addEventListener('error', function(){ tip.textContent='音频加载失败，请重试'; });
</script>
</body>
</html>
